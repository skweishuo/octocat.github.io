<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>你画我猜优化版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: rgba(255, 255, 255, 0.98);
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            display: flex;
            justify-content: stretch;
            align-items: stretch;
            padding: 0;
        }

        .container {
            width: 100%;
            max-width: none;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 0;
            box-shadow: none;
            overflow: hidden;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            text-align: center;
            padding: 20px;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .game-info {
            display: flex;
            justify-content: space-around;
            padding: 15px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
        }

        .info-item {
            text-align: center;
        }

        .info-label {
            font-size: 0.9rem;
            color: #6c757d;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: #495057;
        }

        .timer {
            color: #ff6b6b !important;
        }

        .main-content {
            padding: 20px;
        }

        .word-display {
            text-align: center;
            margin-bottom: 30px;
        }

        .word {
            font-size: 2.5rem;
            font-weight: bold;
            color: #2d3436;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            padding: 20px;
            border: 2px dashed #ddd;
            border-radius: 15px;
            margin: 20px 0;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .controls .btn-warning {
            grid-column: 1 / -1;
        }

        .btn {
            flex: 1;
            min-width: 0;
            width: 100%;
            padding: 15px 20px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-primary {
            background: linear-gradient(45deg, #00b894, #00cec9);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 184, 148, 0.3);
        }

        .btn-success {
            background: linear-gradient(45deg, #00b894, #55efc4);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 184, 148, 0.3);
        }

        .btn-danger {
            background: linear-gradient(45deg, #ff7675, #fd79a8);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 118, 117, 0.3);
        }

        .btn-warning {
            background: linear-gradient(45deg, #fdcb6e, #e17055);
            color: white;
            box-shadow: 0 4px 15px rgba(253, 203, 110, 0.3);
        }

        .settings {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
        }

        .setting-group {
            margin-bottom: 15px;
        }

        .setting-label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #495057;
        }

        .time-options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .time-btn {
            flex: 1;
            min-width: 80px;
            padding: 10px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .time-btn.active {
            border-color: #00b894;
            background: #00b894;
            color: white;
        }

        .timer-control-row {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .timer-toggle-btn {
            flex: 1;
            min-width: 120px;
            padding: 12px 16px;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.35);
        }

        .timer-toggle-btn:hover {
            filter: brightness(1.05);
        }

        .timer-toggle-btn.paused-style {
            background: linear-gradient(45deg, #00b894, #00cec9);
        }

        .timer-toggle-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            filter: none;
        }

        .timer-hint {
            width: 100%;
            font-size: 0.8rem;
            color: #6c757d;
            margin-top: 6px;
        }

        .category-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(88px, 1fr));
            gap: 10px;
        }

        .category-btn {
            padding: 10px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .category-btn.active {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        .start-screen {
            text-align: center;
            padding: 40px 20px;
        }

        .start-btn {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            border: none;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 20px 40px rgba(255, 107, 107, 0.4);
            transition: all 0.3s ease;
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 25px 50px rgba(255, 107, 107, 0.5);
        }

        .game-screen {
            display: none;
        }

        @media (max-width: 768px) {
            .container {
                margin: 0;
                border-radius: 0;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .word {
                font-size: 2rem;
                padding: 15px;
            }

            .btn {
                min-width: 100px;
                padding: 12px 15px;
                font-size: 0.9rem;
            }

            .start-btn {
                width: 150px;
                height: 150px;
                font-size: 1.2rem;
            }
        }

        @media (max-width: 480px) {
            .word {
                font-size: 1.5rem;
            }

            .start-btn {
                width: 120px;
                height: 120px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎨 你画我猜优化版</h1>
            <p>考验默契与想象力的趣味游戏</p>
        </div>

        <div class="start-screen" id="startScreen">
            <h2 style="margin-bottom: 30px; color: #6c757d;">准备好了吗？</h2>
            <button class="start-btn" onclick="startGame()">开始游戏</button>
            <div style="margin-top: 30px; color: #6c757d;">
                <p>⏱️ 120秒计时挑战</p>
                <p>🎯 多种分类词库</p>
                <p>🏆 实时答题统计</p>
            </div>
        </div>

        <div class="game-screen" id="gameScreen">
            <div class="game-info">
                <div class="info-item">
                    <div class="info-label">剩余时间</div>
                    <div class="info-value timer" id="timer">120s</div>
                </div>
                <div class="info-item">
                    <div class="info-label">答对题数</div>
                    <div class="info-value" id="score">0</div>
                </div>
            </div>

            <div class="main-content">
                <div class="word-display">
                    <div class="word" id="currentWord">准备开始...</div>
                </div>

                <div class="controls">
                    <button class="btn btn-success" onclick="nextWord(true)">✅ 答对了</button>
                    <button class="btn btn-danger" onclick="nextWord(false)">❌ 跳过</button>
                    <button class="btn btn-warning" onclick="resetGame()">🔄 重置</button>
                </div>

                <div class="settings">
                    <div class="setting-group">
                        <label class="setting-label">⏱️ 游戏时间</label>
                        <div class="time-options">
                            <button class="time-btn" onclick="setTime(60, this)">60秒</button>
                            <button class="time-btn" onclick="setTime(90, this)">90秒</button>
                            <button class="time-btn active" onclick="setTime(120, this)">120秒</button>
                        </div>
                        <div class="timer-control-row">
                            <button type="button" class="timer-toggle-btn paused-style" id="timerToggleBtn" onclick="toggleTimer()">▶ 开始计时</button>
                        </div>
                        <p class="timer-hint">切换秒数会暂停倒计时，需再点「开始计时」才会走表。</p>
                    </div>

                    <div class="setting-group">
                        <label class="setting-label">📚 词语分类</label>
                        <div class="category-options">
                            <button class="category-btn active" data-category="all">全部</button>
                            <button class="category-btn" data-category="hot">网络热梗</button>
                            <button class="category-btn" data-category="music">歌名</button>
                            <button class="category-btn" data-category="movie">影视</button>
                            <button class="category-btn" data-category="idiom">成语</button>
                            <button class="category-btn" data-category="common">常识</button>
                            <button class="category-btn" data-category="star">明星</button>
                            <button class="category-btn" data-category="anime">动漫游戏</button>
                            <button class="category-btn" data-category="animal">动物植物</button>
                            <button class="category-btn" data-category="food">美食</button>
                            <button class="category-btn" data-category="sport">体育</button>
                            <button class="category-btn" data-category="place">地名景点</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 词库数据
        const wordLibrary = {
            hot: [
                "躺平", "内卷", "破防", "绝绝子", "yyds", "emo", "社死", "摆烂",
                "凡尔赛", "打工人", "摸鱼", "干饭人", "真香", "奥力给", "冲鸭"
            ],
            music: [
                "青花瓷", "告白气球", "夜曲", "稻香", "七里香", "晴天", "双截棍",
                "龙拳", "本草纲目", "小苹果", "最炫民族风", "忐忑", "我的滑板鞋"
            ],
            movie: [
                "复仇者联盟", "速度与激情", "变形金刚", "哈利波特", "泰坦尼克号",
                "阿凡达", "盗梦空间", "肖申克的救赎", "霸王别姬", "哪吒之魔童降世"
            ],
            idiom: [
                "一心一意", "三心二意", "四面八方", "五湖四海", "六神无主",
                "七上八下", "九牛一毛", "十全十美", "一心二用", "三顾茅庐"
            ],
            common: [
                "电脑", "手机", "汽车", "飞机", "火车", "轮船", "自行车", "冰箱",
                "洗衣机", "电视机", "空调", "微波炉", "电饭煲", "吸尘器"
            ],
            star: [
                "周杰伦", "邓紫棋", "薛之谦", "沈腾", "贾玲", "杨幂", "赵丽颖",
                "刘德华", "周星驰", "成龙", "吴京", "胡歌", "刘亦菲", "王一博"
            ],
            anime: [
                "原神", "王者荣耀", "塞尔达传说", "宝可梦", "火影忍者", "海贼王",
                "进击的巨人", "名侦探柯南", "哆啦A梦", "海绵宝宝", "熊出没", "黑神话悟空"
            ],
            animal: [
                "大熊猫", "长颈鹿", "考拉", "企鹅", "海豚", "孔雀", "仙人掌",
                "向日葵", "银杏", "竹子", "含羞草", "猪笼草", "君子兰"
            ],
            food: [
                "火锅", "奶茶", "螺蛳粉", "煎饼果子", "肉夹馍", "小笼包", "兰州拉面",
                "北京烤鸭", "臭豆腐", "冰粉", "蛋挞", "寿司", "披萨"
            ],
            sport: [
                "篮球", "足球", "乒乓球", "羽毛球", "游泳", "马拉松", "滑雪",
                "滑板", "攀岩", "瑜伽", "拳击", "排球", "网球"
            ],
            place: [
                "长城", "故宫", "西湖", "黄山", "九寨沟", "布达拉宫", "外滩",
                "天安门", "兵马俑", "泰山", "桂林山水", "丽江古城", "大三巴"
            ]
        };

        // 全局变量
        let gameState = {
            isRunning: false,
            timerTicking: false,
            timeLeft: 120,
            score: 0,
            currentWord: "",
            selectedCategory: "all",
            selectedTime: 120,
            timer: null,
            usedWords: []
        };

        // 初始化分类按钮事件
        document.querySelectorAll('.category-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                gameState.selectedCategory = this.dataset.category;
                if (gameState.isRunning) {
                    nextWord();
                }
            });
        });

        // 开始游戏
        function startGame() {
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'block';
            
            gameState.isRunning = true;
            gameState.timerTicking = false;
            gameState.timeLeft = gameState.selectedTime;
            gameState.score = 0;
            gameState.usedWords = [];
            
            if (gameState.timer) {
                clearInterval(gameState.timer);
                gameState.timer = null;
            }
            
            updateDisplay();
            updateTimerToggleButton();
            nextWord();
        }

        // 设置游戏时间（切换秒数会暂停走表，需手动点开始）
        function setTime(seconds, el) {
            document.querySelectorAll('.time-btn').forEach(btn => btn.classList.remove('active'));
            if (el) el.classList.add('active');
            gameState.selectedTime = seconds;
            gameState.timeLeft = seconds;
            pauseTimer();
            updateDisplay();
            updateTimerToggleButton();
        }

        function pauseTimer() {
            if (gameState.timer) {
                clearInterval(gameState.timer);
                gameState.timer = null;
            }
            gameState.timerTicking = false;
            updateTimerToggleButton();
        }

        // 启动 / 暂停 倒计时（手动控制）
        function toggleTimer() {
            if (!gameState.isRunning || gameState.timeLeft <= 0) return;
            if (gameState.timerTicking) {
                pauseTimer();
                return;
            }
            if (gameState.timer) {
                clearInterval(gameState.timer);
            }
            gameState.timerTicking = true;
            gameState.timer = setInterval(() => {
                gameState.timeLeft--;
                updateDisplay();
                if (gameState.timeLeft <= 0) {
                    pauseTimer();
                    endGame();
                }
            }, 1000);
            updateTimerToggleButton();
        }

        function updateTimerToggleButton() {
            const btn = document.getElementById('timerToggleBtn');
            if (!btn) return;
            const canStart = gameState.isRunning && gameState.timeLeft > 0;
            btn.disabled = !canStart;
            if (gameState.timerTicking) {
                btn.textContent = '⏸ 暂停';
                btn.classList.remove('paused-style');
            } else {
                btn.textContent = '▶ 开始计时';
                btn.classList.add('paused-style');
            }
        }

        // 结束游戏
        function endGame() {
            gameState.isRunning = false;
            gameState.timerTicking = false;
            if (gameState.timer) {
                clearInterval(gameState.timer);
                gameState.timer = null;
            }
            updateTimerToggleButton();
            
            setTimeout(() => {
                alert(`游戏结束！\n你答对了 ${gameState.score} 道题！`);
                resetGame();
            }, 100);
        }

        // 获取随机词语
        function getRandomWord() {
            let words = [];
            
            if (gameState.selectedCategory === "all") {
                Object.values(wordLibrary).forEach(category => {
                    words = words.concat(category);
                });
            } else {
                words = wordLibrary[gameState.selectedCategory] || [];
            }
            
            if (words.length === 0) {
                return "暂无词语";
            }
            
            // 过滤已使用的词语
            const availableWords = words.filter(word => !gameState.usedWords.includes(word));
            
            if (availableWords.length === 0) {
                gameState.usedWords = [];
                return words[Math.floor(Math.random() * words.length)];
            }
            
            const randomWord = availableWords[Math.floor(Math.random() * availableWords.length)];
            gameState.usedWords.push(randomWord);
            return randomWord;
        }

        // 切换到下一个词语
        function nextWord(isCorrect = false) {
            if (isCorrect && gameState.isRunning) {
                gameState.score++;
            }
            
            if (gameState.isRunning) {
                gameState.currentWord = getRandomWord();
                updateDisplay();
            }
        }

        // 更新显示
        function updateDisplay() {
            document.getElementById('timer').textContent = `${gameState.timeLeft}s`;
            document.getElementById('score').textContent = gameState.score;
            document.getElementById('currentWord').textContent = gameState.currentWord;
            updateTimerToggleButton();
            
            // 时间警告效果
            if (gameState.timeLeft <= 10) {
                document.getElementById('timer').style.color = '#ff6b6b';
                document.getElementById('timer').style.transform = 'scale(1.1)';
                setTimeout(() => {
                    if (document.getElementById('timer')) {
                        document.getElementById('timer').style.transform = 'scale(1)';
                    }
                }, 500);
            } else {
                document.getElementById('timer').style.color = '#ff6b6b';
            }
        }

        // 重置游戏
        function resetGame() {
            if (gameState.timer) {
                clearInterval(gameState.timer);
                gameState.timer = null;
            }
            
            gameState.isRunning = false;
            gameState.timerTicking = false;
            gameState.timeLeft = gameState.selectedTime;
            gameState.score = 0;
            gameState.currentWord = "";
            gameState.usedWords = [];
            
            document.getElementById('startScreen').style.display = 'block';
            document.getElementById('gameScreen').style.display = 'none';
            
            updateDisplay();
            updateTimerToggleButton();
        }

        // 页面加载完成后的初始化
        document.addEventListener('DOMContentLoaded', function() {
            updateDisplay();
        });
    </script>
</body>
</html>
