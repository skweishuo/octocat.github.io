<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>高校你画我猜词库</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #4a90e2;
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .progress {
            font-size: 0.9rem;
            color: #666;
        }

        .card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            margin-bottom: 30px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .category {
            background: #4a90e2;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            display: inline-block;
            margin-bottom: 20px;
        }

        .word {
            font-size: 2rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            word-break: break-all;
        }

        .difficulty {
            margin-bottom: 20px;
        }

        .star {
            color: #ddd;
            font-size: 1.5rem;
            margin: 0 2px;
        }

        .star.filled {
            color: #ffd700;
        }

        .reference {
            background: #e3f2fd;
            border-radius: 10px;
            padding: 15px;
            font-size: 0.9rem;
            color: #666;
            margin-top: 20px;
        }

        .reference strong {
            color: #4a90e2;
        }

        .nav-bar {
            display: flex;
            justify-content: space-around;
            background: white;
            padding: 15px 0;
            border-top: 1px solid #eee;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 500px;
            margin: 0 auto;
            border-radius: 0 0 20px 20px;
        }

        .nav-btn {
            min-width: 44px;
            min-height: 44px;
            padding: 12px 20px;
            border: none;
            border-radius: 25px;
            background: #4a90e2;
            color: white;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            touch-action: manipulation;
        }

        .nav-btn:active {
            transform: scale(0.95);
            background: #357abd;
        }

        .favorite-btn {
            background: #ff6b6b;
        }

        .favorite-btn.active {
            background: #ff4757;
        }

        .landscape-hint {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            color: white;
            font-size: 1.2rem;
            text-align: center;
            padding: 50px;
            z-index: 1000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .landscape-hint p {
            margin-bottom: 20px;
        }

        @media (orientation: landscape) and (max-height: 500px) {
            .landscape-hint {
                display: flex;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            .container {
                border-radius: 15px;
                padding: 15px;
            }
            .card {
                padding: 20px;
            }
            .word {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

        <div class="nav-bar">

                { word: "舞蹈", difficulty: 2, reference: "肢体艺术，需要练习。" },
                { word: "雕塑", difficulty: 3, reference: "立体艺术形式，创作周期长。" },
                { word: "摄影", difficulty: 2, reference: "记录美好瞬间的艺术。" },
                { word: "陶艺", difficulty: 3, reference: "传统手工艺，需要技巧。" },
                { word: "装置艺术", difficulty: 4, reference: "现代艺术形式，概念性强。" },
                { word: "行为艺术", difficulty: 5, reference: "前卫艺术形式，表达观念。" }
            ],
            "职业": [
                { word: "老师", difficulty: 1, reference: "传道授业解惑的职业。" },
                { word: "医生", difficulty: 1, reference: "救死扶伤的白衣天使。" },
                { word: "程序员", difficulty: 2, reference: "编写代码的技术工作者。" },
                { word: "设计师", difficulty: 2, reference: "创造美观实用作品的职业。" },

                { word: "律师", difficulty: 3, reference: "法律专业人士，维护正义。" },

            ],

                { word: "星空", difficulty: 2, reference: "夜空中闪烁的天体集合。" },
                { word: "瀑布", difficulty: 3, reference: "从高处落下的壮观水流。" },
                { word: "极光", difficulty: 4, reference: "高纬度地区的自然光现象。" }
            ],
            "物品": [
                { word: "书包", difficulty: 1, reference: "学生装书的必备用品。" },
                { word: "水杯", difficulty: 1, reference: "日常饮水的容器。" },

            "校园生存": [
                { word: "选课", difficulty: 2, reference: "每学期的重要任务，需要抢课。" },
                { word: "考试", difficulty: 1, reference: "检验学习成果的方式。" },
                { word: "社团", difficulty: 2, reference: "课余时间参与的组织活动。" },

                { word: "论文", difficulty: 4, reference: "学术研究成果的书面表达。" },

                { word: "绩点", difficulty: 3, reference: "衡量学习成绩的重要指标。" },
                { word: "保研", difficulty: 4, reference: "本科毕业后直接读研究生。" }
            ],
            "青春记忆": [
                { word: "军训", difficulty: 1, reference: "大学新生的第一课，难忘经历。" },
                { word: "初恋", difficulty: 2, reference: "青春时期美好的感情回忆。" },
                { word: "毕业照", difficulty: 2, reference: "记录同窗情谊的重要照片。" },
                { word: "宿舍", difficulty: 1, reference: "大学四年的小家，共同回忆。" },
                { word: "食堂", difficulty: 1, reference: "承载无数美好用餐时光的地方。" },
                { word: "图书馆", difficulty: 2, reference: "熬夜奋斗的见证者。" },
                { word: "社团", difficulty: 2, reference: "结交朋友展示才华的平台。" },
                { word: "运动会", difficulty: 2, reference: "展现青春活力的集体活动。" }
            ]
        };

        // 展平词库为数组
        let words = [];
        for (let category in wordLibrary) {
            wordLibrary[category].forEach(item => {
                words.push({
                    ...item,
                    category: category
                });
            });
        }

        // 当前题目索引
        let currentIndex = 0;
        // 收藏的题目索引
        let favorites = new Set(JSON.parse(localStorage.getItem('favorites') || '[]'));

        // DOM元素
        const elements = {
            card: document.getElementById('card'),
            category: document.getElementById('category'),
            word: document.getElementById('word'),
            difficulty: document.getElementById('difficulty'),
            reference: document.getElementById('reference'),
            currentNum: document.getElementById('current-num'),
            totalNum: document.getElementById('total-num'),
            prevBtn: document.getElementById('prev-btn'),
            nextBtn: document.getElementById('next-btn'),
            randomBtn: document.getElementById('random-btn'),
            favoriteBtn: document.getElementById('favorite-btn')
        };

        // 更新显示
        function updateDisplay() {
            const item = words[currentIndex];
            
            elements.category.textContent = item.category;
            elements.word.textContent = item.word;
            
            // 更新难度星级
            let stars = '';
            for (let i = 1; i <= 5; i++) {
                stars += `<span class="star ${i <= item.difficulty ? 'filled' : ''}">${i <= item.difficulty ? '★' : '☆'}</span>`;
            }
            elements.difficulty.innerHTML = stars;
            
            elements.reference.innerHTML = `<strong>参考内容：</strong>${item.reference}`;
            
            elements.currentNum.textContent = currentIndex + 1;
            elements.totalNum.textContent = words.length;
            
            // 更新收藏按钮状态
            elements.favoriteBtn.classList.toggle('active', favorites.has(currentIndex));
        }

        // 切换到指定题目
        function goToIndex(index) {
            if (index >= 0 && index < words.length) {
                currentIndex = index;
                updateDisplay();
            }
        }

        // 下一题
        function nextQuestion() {
            currentIndex = (currentIndex + 1) % words.length;
            updateDisplay();
        }

        // 上一题
        function prevQuestion() {
            currentIndex = (currentIndex - 1 + words.length) % words.length;
            updateDisplay();
        }

        // 随机题目
        function randomQuestion() {
            let newIndex;
            do {
                newIndex = Math.floor(Math.random() * words.length);
            } while (newIndex === currentIndex && words.length > 1);
            currentIndex = newIndex;
            updateDisplay();
        }

        // 切换收藏状态
        function toggleFavorite() {
            if (favorites.has(currentIndex)) {
                favorites.delete(currentIndex);
            } else {
                favorites.add(currentIndex);
            }
            localStorage.setItem('favorites', JSON.stringify([...favorites]));
            updateDisplay();
        }

        // 手势支持
        let startX = 0;
        let startY = 0;

        elements.card.addEventListener('touchstart', function(e) {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
        });

        elements.card.addEventListener('touchend', function(e) {
            if (!startX || !startY) return;
            
            const endX = e.changedTouches[0].clientX;
            const endY = e.changedTouches[0].clientY;
            
            const diffX = startX - endX;
            const diffY = startY - endY;
            
            // 水平滑动距离大于垂直滑动距离，且超过阈值
            if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 50) {
                if (diffX > 0) {
                    nextQuestion(); // 左滑
                } else {
                    prevQuestion(); // 右滑
                }
            }
            
            startX = 0;
            startY = 0;
        });

        // 事件监听
        elements.nextBtn.addEventListener('click', nextQuestion);
        elements.prevBtn.addEventListener('click', prevQuestion);
        elements.randomBtn.addEventListener('click', randomQuestion);
        elements.favoriteBtn.addEventListener('click', toggleFavorite);

        // 键盘支持
        document.addEventListener('keydown', function(e) {
            switch(e.key) {
                case 'ArrowLeft':
                    prevQuestion();
                    break;
                case 'ArrowRight':
                    nextQuestion();
                    break;
                case ' ':
                    randomQuestion();
                    e.preventDefault();
                    break;
                case 'f':
                case 'F':
                    toggleFavorite();
                    break;
            }
        });

        // 初始化
        elements.totalNum.textContent = words.length;
        updateDisplay();
    </script>
</body>
</html>
