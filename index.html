<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>你画我猜优化版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        button {
            font-family: inherit;
        }

        html {
            min-height: 100%;
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background:
                radial-gradient(circle at top left, rgba(255, 197, 118, 0.35), transparent 30%),
                radial-gradient(circle at top right, rgba(102, 126, 234, 0.26), transparent 34%),
                linear-gradient(180deg, #fff8f3 0%, #f6f7ff 100%);
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            display: flex;
            justify-content: stretch;
            align-items: stretch;
            padding: 0;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            touch-action: manipulation;
        }

        .container {
            width: 100%;
            max-width: none;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 0;
            box-shadow: none;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 55%, #fdcb6e 100%);
            color: white;
            text-align: center;
            padding: calc(18px + env(safe-area-inset-top)) 20px 18px;
            box-shadow: 0 10px 26px rgba(238, 90, 36, 0.2);
        }

        .header h1 {
            font-size: clamp(1.45rem, 5vw, 2rem);
            font-weight: 600;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.92;
        }

        .game-info {
            display: flex;
            justify-content: space-around;
            padding: 15px;
            background: rgba(255, 255, 255, 0.88);
            border-bottom: 1px solid rgba(233, 236, 239, 0.8);
            position: sticky;
            top: 0;
            z-index: 5;
            backdrop-filter: blur(14px);
        }

        .info-item {
            text-align: center;
        }

        .info-label {
            font-size: 0.9rem;
            color: #6c757d;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: #495057;
        }

        .timer {
            color: #ff6b6b !important;
        }

        .main-content {
            flex: 1;
            padding: clamp(16px, 4vw, 26px);
        }

        .word-display {
            text-align: center;
            margin-bottom: 24px;
        }

        .word {
            min-height: 128px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(2rem, 10vw, 3.2rem);
            font-weight: bold;
            color: #5b5fd7;
            background: rgba(255, 255, 255, 0.9);
            padding: clamp(18px, 6vw, 30px);
            border: 2px dashed rgba(102, 126, 234, 0.35);
            border-radius: 22px;
            margin: 18px 0;
            box-shadow: 0 14px 34px rgba(102, 126, 234, 0.12);
            text-shadow: 0 4px 16px rgba(102, 126, 234, 0.16);
            word-break: break-word;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .controls .btn-warning {
            grid-column: 1 / -1;
        }

        .btn {
            flex: 1;
            min-width: 0;
            width: 100%;
            padding: 15px 18px;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            min-height: 52px;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-primary {
            background: linear-gradient(45deg, #00b894, #00cec9);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 184, 148, 0.3);
        }

        .btn-success {
            background: linear-gradient(45deg, #00b894, #55efc4);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 184, 148, 0.3);
        }

        .btn-danger {
            background: linear-gradient(45deg, #ff7675, #fd79a8);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 118, 117, 0.3);
        }

        .btn-warning {
            background: linear-gradient(45deg, #fdcb6e, #e17055);
            color: white;
            box-shadow: 0 4px 15px rgba(253, 203, 110, 0.3);
        }

        .settings {
            background: rgba(255, 255, 255, 0.82);
            padding: clamp(16px, 4vw, 22px);
            border: 1px solid rgba(222, 226, 230, 0.8);
            border-radius: 20px;
            margin-top: 20px;
            box-shadow: 0 12px 30px rgba(45, 52, 54, 0.08);
        }

        .setting-group {
            margin-bottom: 15px;
        }

        .setting-label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #495057;
        }

        .time-options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .time-btn {
            flex: 1;
            min-width: 80px;
            padding: 10px;
            border: 2px solid #dee2e6;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
            min-height: 44px;
        }

        .time-btn.active {
            border-color: #00b894;
            background: #00b894;
            color: white;
        }

        .timer-control-row {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .timer-toggle-btn {
            flex: 1;
            min-width: 120px;
            padding: 12px 16px;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.35);
        }

        .timer-toggle-btn:hover {
            filter: brightness(1.05);
        }

        .timer-toggle-btn.paused-style {
            background: linear-gradient(45deg, #00b894, #00cec9);
        }

        .timer-toggle-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            filter: none;
        }

        .timer-hint {
            width: 100%;
            font-size: 0.8rem;
            color: #6c757d;
            margin-top: 6px;
        }

        .category-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(88px, 1fr));
            gap: 10px;
        }

        .category-btn,
        .repeat-btn {
            padding: 10px;
            border: 2px solid #dee2e6;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            min-height: 44px;
        }

        .category-btn.active,
        .repeat-btn.active {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        .repeat-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(92px, 1fr));
            gap: 10px;
        }

        .word-stats {
            margin-top: 10px;
            font-size: 0.82rem;
            color: #6c757d;
            line-height: 1.5;
        }

        .start-screen {
            text-align: center;
            padding: clamp(36px, 10vh, 70px) 20px;
        }

        .start-btn {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            border: none;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 20px 40px rgba(255, 107, 107, 0.4);
            transition: all 0.3s ease;
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }

        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 25px 50px rgba(255, 107, 107, 0.5);
        }

        .group-select {
            width: min(100%, 420px);
            margin: 0 auto 18px;
            padding: 18px;
            border: 1px solid rgba(222, 226, 230, 0.85);
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.86);
            box-shadow: 0 10px 26px rgba(45, 52, 54, 0.08);
        }

        .group-select-title {
            margin-bottom: 12px;
            color: #495057;
            font-weight: 600;
        }

        .group-options {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .group-btn {
            min-height: 46px;
            border: 2px solid #dee2e6;
            border-radius: 12px;
            background: #fff;
            color: #495057;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .group-btn.active {
            border-color: #ff6b6b;
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: #fff;
            box-shadow: 0 6px 18px rgba(238, 90, 36, 0.28);
        }

        .game-screen {
            display: none;
        }

        @media (min-width: 769px) {
            .container {
                max-width: 760px;
                min-height: calc(100dvh - 40px);
                margin: 20px auto;
                border-radius: 28px;
                overflow: hidden;
                box-shadow: 0 24px 70px rgba(45, 52, 54, 0.14);
            }
        }

        @media (max-width: 768px) {
            .container {
                margin: 0;
                border-radius: 0;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .btn {
                min-width: 100px;
                padding: 12px 15px;
                font-size: 0.9rem;
            }

            .start-btn {
                width: 150px;
                height: 150px;
                font-size: 1.2rem;
            }
        }

        @media (max-width: 480px) {
            .header {
                padding-bottom: 14px;
            }

            .game-info {
                padding: 12px 10px;
            }

            .controls {
                gap: 10px;
            }

            .category-options {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }

            .start-btn {
                width: 120px;
                height: 120px;
                font-size: 1rem;
            }

            .group-options {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* 时间到 — 自定义弹层 */
        .timeup-modal[hidden] {
            display: none !important;
        }

        .timeup-modal {
            position: fixed;
            inset: 0;
            z-index: 10000;
            display: grid;
            place-items: center;
            padding: 24px;
            box-sizing: border-box;
        }

        .timeup-modal__backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.48);
            backdrop-filter: blur(8px);
        }

        .timeup-modal__card {
            position: relative;
            width: min(92vw, 360px);
            padding: 26px 22px 22px;
            border-radius: 18px;
            background: #fff;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.22);
            text-align: center;
            animation: timeup-pop 0.32s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes timeup-pop {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(12px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .timeup-modal__icon {
            font-size: 2.75rem;
            line-height: 1;
            margin-bottom: 6px;
        }

        .timeup-modal__title {
            margin: 0 0 8px;
            font-size: 1.45rem;
            font-weight: 700;
            color: #ee5a24;
        }

        .timeup-modal__desc {
            margin: 0 0 14px;
            font-size: 0.9rem;
            color: #6c757d;
            line-height: 1.5;
        }

        .timeup-modal__score {
            margin: 0 0 22px;
            font-size: 1.15rem;
            color: #2d3436;
        }

        .timeup-modal__score strong {
            color: #00b894;
            font-size: 1.35rem;
        }

        .timeup-modal__btn {
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            color: #fff;
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            box-shadow: 0 6px 20px rgba(238, 90, 36, 0.35);
        }

        .timeup-modal__btn:active {
            transform: scale(0.98);
        }

        body.timeup-modal-open {
            overflow: hidden;
            touch-action: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎨 你画我猜优化版</h1>
            <p>考验默契与想象力的趣味游戏</p>
        </div>

        <div class="start-screen" id="startScreen">
            <h2 style="margin-bottom: 30px; color: #6c757d;">准备好了吗？</h2>
            <div class="group-select" aria-label="选择小组">
                <div class="group-select-title">先选择小组</div>
                <div class="group-options">
                    <button type="button" class="group-btn active" data-group="1">1组</button>
                    <button type="button" class="group-btn" data-group="2">2组</button>
                    <button type="button" class="group-btn" data-group="3">3组</button>
                    <button type="button" class="group-btn" data-group="4">4组</button>
                </div>
            </div>
            <button class="start-btn" onclick="startGame()">开始游戏</button>
            <div style="margin-top: 30px; color: #6c757d;">
                <p>⏱️ 120秒计时挑战</p>
                <p>🎯 4组每日题目不重复</p>
                <p>🏆 实时答题统计</p>
            </div>
        </div>

        <div class="game-screen" id="gameScreen">
            <div class="game-info">
                <div class="info-item">
                    <div class="info-label">剩余时间</div>
                    <div class="info-value timer" id="timer">120s</div>
                </div>
                <div class="info-item">
                    <div class="info-label">答对题数</div>
                    <div class="info-value" id="score">0</div>
                </div>
                <div class="info-item">
                    <div class="info-label">当前小组</div>
                    <div class="info-value" id="currentGroup">1组</div>
                </div>
            </div>

            <div class="main-content">
                <div class="word-display">
                    <div class="word" id="currentWord">准备开始...</div>
                </div>

                <div class="controls">
                    <button class="btn btn-success" onclick="nextWord(true)">✅ 答对了</button>
                    <button class="btn btn-danger" onclick="nextWord(false)">❌ 跳过</button>
                    <button class="btn btn-warning" onclick="resetGame()">🔄 重置</button>
                </div>

                <div class="settings">
                    <div class="setting-group">
                        <label class="setting-label">⏱️ 游戏时间</label>
                        <div class="time-options">
                            <button class="time-btn" onclick="setTime(60, this)">60秒</button>
                            <button class="time-btn" onclick="setTime(90, this)">90秒</button>
                            <button class="time-btn active" onclick="setTime(120, this)">120秒</button>
                        </div>
                        <div class="timer-control-row">
                            <button type="button" class="timer-toggle-btn paused-style" id="timerToggleBtn" onclick="toggleTimer()">▶ 开始计时</button>
                        </div>
                        <p class="timer-hint">切换秒数会暂停倒计时，需再点「开始计时」才会走表。</p>
                    </div>

                    <div class="setting-group">
                        <label class="setting-label">📚 词语分类</label>
                        <div class="category-options">
                            <button class="category-btn active" data-category="all">全部</button>
                            <button class="category-btn" data-category="hot">网络热梗</button>
                            <button class="category-btn" data-category="music">歌名</button>
                            <button class="category-btn" data-category="movie">影视</button>
                            <button class="category-btn" data-category="idiom">成语</button>
                            <button class="category-btn" data-category="common">常识</button>
                            <button class="category-btn" data-category="star">明星</button>
                            <button class="category-btn" data-category="anime">动漫游戏</button>
                            <button class="category-btn" data-category="animal">动物植物</button>
                            <button class="category-btn" data-category="food">美食</button>
                            <button class="category-btn" data-category="sport">体育</button>
                            <button class="category-btn" data-category="place">地名景点</button>
                        </div>
                        <p class="word-stats" id="wordStats">当前词库加载中...</p>
                    </div>

                    <div class="setting-group">
                        <label class="setting-label">🔁 重复控制</label>
                        <div class="repeat-options">
                            <button class="repeat-btn" data-repeat-limit="20">近20题</button>
                            <button class="repeat-btn" data-repeat-limit="50">近50题</button>
                            <button class="repeat-btn active" data-repeat-limit="100">近100题</button>
                            <button class="repeat-btn" data-repeat-limit="9999">本轮尽量不重复</button>
                        </div>
                        <p class="word-stats">词库循环后，也会优先避开最近出现过的词。</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="timeupModal" class="timeup-modal" hidden role="dialog" aria-modal="true" aria-labelledby="timeupTitle">
        <div class="timeup-modal__backdrop" onclick="closeTimeUpModal()"></div>
        <div class="timeup-modal__card">
            <div class="timeup-modal__icon" aria-hidden="true">⏱</div>
            <h2 id="timeupTitle" class="timeup-modal__title">时间到</h2>
            <p class="timeup-modal__desc">本轮挑战结束，看看你们答对了几题。</p>
            <p class="timeup-modal__score">答对 <strong id="timeupScore">0</strong> 题</p>
            <button type="button" class="timeup-modal__btn" onclick="closeTimeUpModal()">知道了</button>
        </div>
    </div>

        // 全局变量
        const DAILY_WORD_STORAGE_KEY = 'drawGuessDailyWordsV1';

        let gameState = {
            isRunning: false,
            timerTicking: false,
            timeLeft: 120,
            score: 0,
            currentWord: "",
            selectedGroup: "1",
            selectedCategory: "all",
            selectedTime: 120,
            timer: null,
            usedWords: [],
            recentWords: [],
            repeatHistoryLimit: 100
        };

        function getTodayKey() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function getDailyWordRecord() {
            const today = getTodayKey();
            const fallback = { date: today, usedWords: [], groups: {} };

            try {
                const rawRecord = localStorage.getItem(DAILY_WORD_STORAGE_KEY);
                if (!rawRecord) return fallback;

                const record = JSON.parse(rawRecord);
                if (record.date !== today) return fallback;

                return {
                    date: today,
                    usedWords: Array.isArray(record.usedWords) ? record.usedWords : [],
                    groups: record.groups && typeof record.groups === 'object' ? record.groups : {}
                };
            } catch (error) {
                return fallback;
            }
        }

        function saveDailyWordRecord(record) {
            try {
                localStorage.setItem(DAILY_WORD_STORAGE_KEY, JSON.stringify(record));
            } catch (error) {
                // localStorage 不可用时仍可继续本轮游戏，只是刷新后无法保留每日去重。
            }
        }

        function rememberDailyWord(word) {
            if (!word || word === "暂无词语" || word === "今日题目已抽完") return;

            const record = getDailyWordRecord();
            if (!record.usedWords.includes(word)) {
                record.usedWords.push(word);
            }

            const groupKey = `group${gameState.selectedGroup}`;
            if (!Array.isArray(record.groups[groupKey])) {
                record.groups[groupKey] = [];
            }
            if (!record.groups[groupKey].includes(word)) {
                record.groups[groupKey].push(word);
            }

            saveDailyWordRecord(record);
        }

        function getTodayUsedWords() {
            return getDailyWordRecord().usedWords;
        }

        // 初始化小组选择事件
        document.querySelectorAll('.group-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.group-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                gameState.selectedGroup = this.dataset.group;
                updateDisplay();
                updateWordStats();
            });
        });

        // 初始化分类按钮事件
        document.querySelectorAll('.category-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                gameState.selectedCategory = this.dataset.category;
                updateWordStats();
                if (gameState.isRunning) {
                    nextWord();
                }
            });
        });

        // 初始化重复控制按钮事件
        document.querySelectorAll('.repeat-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.repeat-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                gameState.repeatHistoryLimit = Number(this.dataset.repeatLimit);
                updateWordStats();
            });
        });

        // 开始游戏
        function startGame() {
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'block';
            
            gameState.isRunning = true;
            gameState.timerTicking = false;
            gameState.timeLeft = gameState.selectedTime;
            gameState.score = 0;
            gameState.usedWords = [];
            gameState.recentWords = [];
            
            if (gameState.timer) {
                clearInterval(gameState.timer);
                gameState.timer = null;
            }
            
            updateDisplay();
            updateTimerToggleButton();
            nextWord();
        }

        // 设置游戏时间（切换秒数会暂停走表，需手动点开始）
        function setTime(seconds, el) {
            document.querySelectorAll('.time-btn').forEach(btn => btn.classList.remove('active'));
            if (el) el.classList.add('active');
            gameState.selectedTime = seconds;
            gameState.timeLeft = seconds;
            pauseTimer();
            updateDisplay();
            updateTimerToggleButton();
        }

        function pauseTimer() {
            if (gameState.timer) {
                clearInterval(gameState.timer);
                gameState.timer = null;
            }
            gameState.timerTicking = false;
            updateTimerToggleButton();
        }

        // 启动 / 暂停 倒计时（手动控制）
        function toggleTimer() {
            if (!gameState.isRunning || gameState.timeLeft <= 0) return;
            if (gameState.timerTicking) {
                pauseTimer();
                return;
            }
            if (gameState.timer) {
                clearInterval(gameState.timer);
            }
            gameState.timerTicking = true;
            gameState.timer = setInterval(() => {
                gameState.timeLeft--;
                updateDisplay();
                if (gameState.timeLeft <= 0) {
                    pauseTimer();
                    endGame();
                }
            }, 1000);
            updateTimerToggleButton();
        }

        function updateTimerToggleButton() {
            const btn = document.getElementById('timerToggleBtn');
            if (!btn) return;
            const canStart = gameState.isRunning && gameState.timeLeft > 0;
            btn.disabled = !canStart;
            if (gameState.timerTicking) {
                btn.textContent = '⏸ 暂停';
                btn.classList.remove('paused-style');
            } else {
                btn.textContent = '▶ 开始计时';
                btn.classList.add('paused-style');
            }
        }

        // 结束游戏
        function endGame() {
            gameState.isRunning = false;
            gameState.timerTicking = false;
            if (gameState.timer) {
                clearInterval(gameState.timer);
                gameState.timer = null;
            }
            updateTimerToggleButton();

            setTimeout(() => {
                showTimeUpModal(gameState.score);
            }, 100);
        }

        function showTimeUpModal(score) {
            const modal = document.getElementById('timeupModal');
            document.getElementById('timeupScore').textContent = String(score);
            modal.removeAttribute('hidden');
            document.body.classList.add('timeup-modal-open');
        }

        function closeTimeUpModal() {
            const modal = document.getElementById('timeupModal');
            if (!modal.hasAttribute('hidden')) {
                modal.setAttribute('hidden', '');
                document.body.classList.remove('timeup-modal-open');
                resetGame();
            }
        }

        function getCurrentWordPool() {
            let words = [];
            
            if (gameState.selectedCategory === "all") {
                Object.values(wordLibrary).forEach(category => {
                    words = words.concat(category);
                });
            } else {
                words = wordLibrary[gameState.selectedCategory] || [];
            }

            return [...new Set(words)];
        }

        function formatRepeatLimit(limit) {
            return limit >= 9999 ? "本轮尽量不重复" : `近${limit}题不重复`;
        }

        function updateWordStats() {
            const stats = document.getElementById('wordStats');
            if (!stats) return;

            const words = getCurrentWordPool();
            const todayUsedWords = getTodayUsedWords();
            const appearedCount = words.filter(word => gameState.usedWords.includes(word)).length;
            const todayUsedCount = words.filter(word => todayUsedWords.includes(word)).length;
            const remainingCount = Math.max(words.length - todayUsedCount, 0);
            stats.textContent = `当前分类共 ${words.length} 个词，本轮已出现 ${appearedCount} 个；今日四组已用 ${todayUsedCount} 个，剩余 ${remainingCount} 个；${formatRepeatLimit(gameState.repeatHistoryLimit)}。`;
        }

        // 获取随机词语
        function getRandomWord() {
            const words = getCurrentWordPool();
            
            if (words.length === 0) {
                return "暂无词语";
            }
            
            const repeatLimit = Math.min(gameState.repeatHistoryLimit, Math.max(words.length - 1, 0));
            const recentBlockedWords = new Set(repeatLimit > 0 ? gameState.recentWords.slice(-repeatLimit) : []);
            const todayUsedWords = new Set(getTodayUsedWords());
            let availableWords = words.filter(word => {
                return !todayUsedWords.has(word) && !gameState.usedWords.includes(word) && !recentBlockedWords.has(word);
            });
            
            if (availableWords.length === 0) {
                availableWords = words.filter(word => !todayUsedWords.has(word));
            }

            if (availableWords.length === 0) {
                updateWordStats();
                return "今日题目已抽完";
            }
            
            const randomWord = availableWords[Math.floor(Math.random() * availableWords.length)];
            gameState.usedWords.push(randomWord);
            gameState.recentWords.push(randomWord);
            rememberDailyWord(randomWord);

            if (gameState.recentWords.length > 300) {
                gameState.recentWords = gameState.recentWords.slice(-300);
            }

            updateWordStats();
            return randomWord;
        }

        // 切换到下一个词语
        function nextWord(isCorrect = false) {
            if (isCorrect && gameState.isRunning && gameState.currentWord !== "今日题目已抽完") {
                gameState.score++;
            }
            
            if (gameState.isRunning) {
                gameState.currentWord = getRandomWord();
                updateDisplay();
            }
        }

        // 更新显示
        function updateDisplay() {
            document.getElementById('timer').textContent = `${gameState.timeLeft}s`;
            document.getElementById('score').textContent = gameState.score;
            document.getElementById('currentWord').textContent = gameState.currentWord;
            document.getElementById('currentGroup').textContent = `${gameState.selectedGroup}组`;
            updateTimerToggleButton();
            
            // 时间警告效果
            if (gameState.timeLeft <= 10) {
                document.getElementById('timer').style.color = '#ff6b6b';
                document.getElementById('timer').style.transform = 'scale(1.1)';
                setTimeout(() => {
                    if (document.getElementById('timer')) {
                        document.getElementById('timer').style.transform = 'scale(1)';
                    }
                }, 500);
            } else {
                document.getElementById('timer').style.color = '#ff6b6b';
            }
        }

        // 重置游戏
        function resetGame() {
            if (gameState.timer) {
                clearInterval(gameState.timer);
                gameState.timer = null;
            }
            
            gameState.isRunning = false;
            gameState.timerTicking = false;
            gameState.timeLeft = gameState.selectedTime;
            gameState.score = 0;
            gameState.currentWord = "";
            gameState.usedWords = [];
            gameState.recentWords = [];
            
            document.getElementById('startScreen').style.display = 'block';
            document.getElementById('gameScreen').style.display = 'none';
            
            updateDisplay();
            updateTimerToggleButton();
            updateWordStats();
        }

        // 页面加载完成后的初始化
        document.addEventListener('DOMContentLoaded', function() {
            updateDisplay();
            updateWordStats();
        });
